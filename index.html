</main><script>
const mascot=document.getElementById('mascot'),state=document.getElementById('state'),jp=document.getElementById('jp'),wave=document.getElementById('wave'),mic=document.getElementById('mic'),result=document.getElementById('result'),halo=document.getElementById('halo');
let recognition=null,listening=false,records=JSON.parse(localStorage.getItem('jarvis_bmonster')||'[]');
function setState(s,j){state.textContent=s;jp.textContent=j;mascot.className='mascot '+s.toLowerCase().replace('...','');wave.classList.toggle('on',s==='LISTENING...');halo.classList.toggle('active',s!=='STANDBY');}
function toast(t){const e=document.getElementById('toast');e.textContent=t;e.classList.add('show');setTimeout(()=>e.classList.remove('show'),1800)}
function speak(t){if('speechSynthesis'in window){speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='ja-JP';u.rate=.98;speechSynthesis.speak(u)}}
function parseAndRespond(text){
 setState('THINKING...','考えてるモン。');

 setTimeout(()=>{

   const q=text.replace(/[。！？!?]/g,'');

   // 2026年の回数
   if(/何回|何件|回数/.test(q)&&/今年|2026/.test(q)){
     const n=records.filter(r=>new Date(r.date).getFullYear()===2026).length;
     respond(`2026年のビーモンスターは${n}回ですモン。`);
     return;
   }

   // -----------------------------
   // プログラム名を音声から抽出
   // -----------------------------
   let program=null;

   const programMatch=q.match(
     /(?:プログラム|クラス|レッスン|受けたのは|受けたのが)?\s*([A-Za-z][A-Za-z0-9 _-]*[A-Za-z0-9])/
   );

   if(programMatch){
     program=programMatch[1].trim();
   }

   // 日本語で言われた場合
   if(/ハードコア/i.test(q)){
     program='HARD CORE';
   }else if(/ハード/i.test(q)){
     program='HARD';
   }else if(/ノーマル/i.test(q)){
     program='NORMAL';
   }else{
     const mix=q.match(/MIX\s*([0-9]+)/i);
     if(mix){
       program='MIX'+mix[1];
     }
   }

   // -----------------------------
   // PF
   // -----------------------------
   let performer=null;

   const performers=['Vivi','TOHYA'];

   for(const name of performers){
     if(new RegExp(name,'i').test(q)){
       performer=name;
       break;
     }
   }

   // 「PF Vivi」
   if(!performer){
     const pm=q.match(
       /(?:インストラクター|PF|パフォーマー)[:： ]*([^\s]+)/i
     );

     if(pm){
       performer=pm[1];
     }
   }

   // -----------------------------
   // スタジオ
   // -----------------------------
   let studio=null;

   if(/梅田/i.test(q)){
     studio='梅田';
   }

   // -----------------------------
   // b-monster記録
   // -----------------------------
   if(
     /ビーモンスター|b-monster|ビー?モン/i.test(q)
     &&
     /行った|受けた|行きました|参加|やった/i.test(q)
   ){

     const rec={
       date:new Date().toISOString().slice(0,10),
       program:program,
       studio:studio,
       performer:performer,
       raw:text
     };

     records.push(rec);

     localStorage.setItem(
       'jarvis_bmonster',
       JSON.stringify(records)
     );

     fetch('https://jarvis.exiletypeth.workers.dev/',{
       method:'POST',
       headers:{
         'Content-Type':'application/json'
       },
       body:JSON.stringify(rec)
     })
     .then(r=>r.json())
     .then(data=>{

       if(data.object === 'page'){

         let detail='';

         if(performer) detail+=` PF:${performer}`;
         if(program) detail+=` プログラム:${program}`;
         if(studio) detail+=` スタジオ:${studio}`;

         respond(
           `Notion登録成功。${detail || '詳細情報は未入力'} モン。`
         );

       }else{

         respond(
           `Notion登録エラー：${
             data.message ||
             data.error ||
             JSON.stringify(data)
           } モン。`
         );

       }
     })
     .catch(()=>{
       respond(
         'b-monsterは記録したモン。Notionへの接続でエラーが出たモン。'
       );
     });

     return;
   }

   respond('まだうまく理解できなかったモン。');

 },500);
}
 function respond(t){setState('RESPONDING...','できたモン！');result.innerHTML='<small>JARVIS</small><br><b>'+t+'</b>';result.classList.add('show');speak(t);setTimeout(()=>setState('STANDBY','話しかけてほしいモン。'),2500)}
function toggleMic(){if(listening){stopMic();return}if(!('webkitSpeechRecognition'in window||'SpeechRecognition'in window)){toast('このブラウザは音声認識に未対応モン');return}const R=window.SpeechRecognition||window.webkitSpeechRecognition;recognition=new R();recognition.lang='ja-JP';recognition.continuous=false;recognition.interimResults=true;recognition.onstart=()=>{listening=true;mic.classList.add('listening');setState('LISTENING...','聞いてるモン！')};recognition.onresult=e=>{let text='';for(let i=e.resultIndex;i<e.results.length;i++)text+=e.results[i][0].transcript;if(e.results[e.results.length-1].isFinal){stopMic();parseAndRespond(text)}};recognition.onerror=e=>{stopMic();toast('音声認識エラー: '+e.error+' モン')};recognition.onend=()=>{listening=false;mic.classList.remove('listening')};recognition.start()}
function stopMic(){if(recognition)recognition.stop();listening=false;mic.classList.remove('listening');}
function showRecords(){openSheet();document.querySelector('.sheet').innerHTML='<button class="close" onclick="closeSheet()">×</button><h2>RECORDS / b-monster</h2>'+ (records.length?records.slice().reverse().map(r=>`<div class="item"><span>${new Date(r.date).toLocaleDateString('ja-JP')}<br><small>${r.class} / ${r.instructor}</small></span><span>●</span></div>`).join(''):'<p style="color:#999">まだ記録がないモン。</p>');}
function askStats(){const n=records.filter(r=>new Date(r.date).getFullYear()===2026).length;result.innerHTML='<small>ANALYSIS</small><br><b>2026年：'+n+'回</b>';result.classList.add('show');speak(`2026年のビーモンスターは${n}回ですモン。`);setState('RESPONDING...','集計したモン！');setTimeout(()=>setState('STANDBY','話しかけてほしいモン。'),2500)}
function openSheet(){document.getElementById('panel').classList.add('open')}function closeSheet(){document.getElementById('panel').classList.remove('open')}
setState('STANDBY','話しかけてほしいモン。');
</script></body></html>
